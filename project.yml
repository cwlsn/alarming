name: Alarming
options:
  bundleIdPrefix: com.cwlsn
  deploymentTarget: { iOS: "26.1" }
configFiles: { Debug: Config/Base.xcconfig, Release: Config/Base.xcconfig }
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AlarmingCore: { path: Core }
targets:
  Alarming:
    type: application
    platform: iOS
    sources: [App, Shared, Resources]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).alarming, ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon } }
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Alarming
        AppGroup: group.$(BUNDLE_PREFIX).alarming
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAlarmKitUsageDescription: Alarming rings at the times you set, even in Silent mode or a Focus.
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/Alarming.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).alarming]
    dependencies: [{ target: AlarmingWidget }, { package: AlarmingCore }]
  AlarmingWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).alarming.widget } }
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Alarming
        AppGroup: group.$(BUNDLE_PREFIX).alarming
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    entitlements:
      path: Widget/AlarmingWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).alarming]
    dependencies: [{ package: AlarmingCore }]
  AlarmingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).alarming.uitests, GENERATE_INFOPLIST_FILE: true } }
    dependencies: [{ target: Alarming }]
schemes:
  Alarming:
    build: { targets: { Alarming: all } }
    test: { targets: [AlarmingUITests] }
