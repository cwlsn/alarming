name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  XCODE_VERSION: "27.2"
  XCODEGEN_VERSION: "2.48.0"
  SIMULATOR_NAME: "iPhone 18 Pro"
  SIMULATOR_RUNTIME: "com.apple.CoreSimulator.SimRuntime.iOS-27-2"

jobs:
  core:
    name: Core tests
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Run tests
        working-directory: Core
        run: swift test

  ui:
    name: UI tests
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Boot simulator
        # A fresh simulator takes minutes to boot. Starting now overlaps that with the build.
        run: |
          udid=$(xcrun simctl list devices available -j |
            jq -r --arg runtime "$SIMULATOR_RUNTIME" --arg name "$SIMULATOR_NAME" \
              '.devices[$runtime][]? | select(.name == $name) | .udid' | head -n 1)
          if [ -z "$udid" ]; then
            echo "::error::No $SIMULATOR_NAME simulator for $SIMULATOR_RUNTIME"
            exit 1
          fi
          xcrun simctl boot "$udid"
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        run: xcodegen generate
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Alarming.xcodeproj \
            -scheme Alarming \
            -destination "id=$SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult"
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: UITests.xcresult
          path: ${{ runner.temp }}/UITests.xcresult
